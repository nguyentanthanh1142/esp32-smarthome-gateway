; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Monitor Settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder ; Tự động decode lỗi Crash/Backtrace
monitor_encoding = utf-8

upload_protocol = espota
upload_port = 192.168.1.26

lib_deps = 
    knolleary/PubSubClient
    beegee-tokyo/DHT sensor library for ESPx
    madhephaestus/ESP32Servo
    https://github.com/OSSLibraries/Arduino_MFRC522v2.git#2.0.4
    bblanchon/ArduinoJson@^7.0.4
    tzapu/WiFiManager
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall 
extra_scripts = pre:scripts/generate_secret.py
