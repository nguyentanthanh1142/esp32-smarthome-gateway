name: ESP32 IoT CI/CD & MQTT OTA Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    name: Build, Release & Trigger OTA
    runs-on: ubuntu-latest

    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO & Paho-MQTT
        run: pip install platformio paho-mqtt

      - name: Generate secret.h from GitHub Secrets
        run: |
          echo '#ifndef SECRET_H' > include/secret.h
          echo '#define SECRET_H' >> include/secret.h
          echo '#define MQTT_SERVER "${{ secrets.MQTT_SERVER }}"' >> include/secret.h
          echo '#define MQTT_PORT 1883' >> include/secret.h
          echo '#define MQTT_USER "${{ secrets.MQTT_USER }}"' >> include/secret.h
          echo '#define MQTT_PASS "${{ secrets.MQTT_PASS }}"' >> include/secret.h
          echo '#endif' >> include/secret.h

      - name: Build Firmware
        run: pio run

      - name: Create GitHub Release & Upload Firmware
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: "Tự động build từ commit ${{ github.sha }}"
          draft: false
          prerelease: false
          files: .pio/build/esp32dev/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FW_VERSION: "v1.0.${{ github.run_number }}" 

      - name: Trigger MQTT OTA Update
        if: success() 
        run: |
          python3 -c "
          import paho.mqtt.publish as publish
          import json
          
          # Tạo URL tải xuống từ GitHub Release (Yêu cầu Repo Public)
          repo = '${{ github.repository }}'
          tag = 'v1.0.${{ github.run_number }}'
          url = f'https://github.com/{repo}/releases/download/{tag}/firmware.bin'
          
          payload = json.dumps({
              'url': url,
              'version': tag
          })
          
          print(f'Gửi lệnh OTA: {payload}')
          
          publish.single(
              'esp32/gateway_02/ota/update', 
              payload, 
              hostname='${{ secrets.MQTT_SERVER }}', 
              port=1883, 
              auth={'username': '${{ secrets.MQTT_USER }}', 'password': '${{ secrets.MQTT_PASS }}'}
          )
          print('Đã gửi lệnh MQTT thành công!')
          "